<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>攻殻機動隊風｜日本周辺プレート＋地震 3D</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Noto+Sans+JP:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #02040a;
    color: #00f0ff;
    font-family: 'Noto Sans JP', sans-serif;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 240, 255, 0.03) 2px,
      rgba(0, 240, 255, 0.03) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
    background: linear-gradient(180deg, rgba(0,8,18,0.97) 0%, transparent 100%);
    padding: 18px 32px 40px;
    border-bottom: 1px solid #00f0ff44;
  }
  .title {
    font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 6px;
    color: #00f0ff;
    text-shadow: 0 0 14px #00f0ff, 0 0 40px #00f0ff66;
  }
  .subtitle {
    font-size: 1rem;
    color: #ff00aa;
    margin-top: 6px;
    letter-spacing: 3px;
  }
  .status {
    position: absolute;
    top: 22px; right: 36px;
    font-size: 0.9rem;
    color: #00ff9f;
    text-align: right;
    line-height: 1.5;
  }

  #plot {
    width: 100%;
    height: 100%;
  }

  #info-panel {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 360px;
    background: rgba(0, 12, 24, 0.94);
    border: 1px solid #00f0ff;
    box-shadow: 0 0 25px #00f0ff55;
    padding: 20px 24px;
    z-index: 30;
    display: none;
    font-size: 1rem;
    line-height: 1.7;
  }
  #info-panel h3 {
    color: #ff003c;
    font-size: 1.2rem;
    margin-bottom: 12px;
  }
  #info-panel .close {
    position: absolute;
    top: 12px; right: 16px;
    cursor: pointer;
    color: #00f0ff;
    font-size: 1.4rem;
  }
  #info-panel .close:hover { color: #ff00aa; }

  #footer {
    position: absolute;
    bottom: 18px; left: 28px;
    font-size: 0.85rem;
    color: #00f0ff99;
    z-index: 20;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="title">SECTION-9 // 地殻プレート監視網</div>
  <div class="subtitle">日本周辺プレート境界 + 直近地震活動</div>
  <div class="status">
    システム稼働中<br>
    深さ誇張表示 ×3.5
  </div>
</div>

<div id="plot"></div>

<div id="info-panel">
  <div class="close" onclick="document.getElementById('info-panel').style.display='none'">×</div>
  <h3 id="info-title">震源情報</h3>
  <div id="info-body"></div>
</div>

<div id="footer">
  太平洋 → シアン　｜　フィリピン海 → マゼンタ<br>
  オホーツク → 黄緑　｜　アムール → 紫<br>
  赤い球体をクリックすると震源詳細が表示されます
</div>

<script>
// ===== 日本列島 =====
const japan = {
  honshu: {
    lon: [141.0,141.6,142.1,142.4,141.9,141.3,140.7,140.1,139.4,138.6,137.6,136.7,135.8,135.0,134.3,133.5,132.7,131.9,131.2,130.7,130.9,131.5,132.4,133.4,134.4,135.4,136.4,137.4,138.4,139.4,140.3,140.9,141.0],
    lat: [41.6,41.1,40.3,39.1,38.1,37.3,36.6,35.9,35.3,34.9,34.7,34.5,34.6,34.8,34.6,34.1,33.7,33.6,33.9,34.4,35.0,35.6,35.9,36.3,36.6,36.9,37.1,37.6,38.3,39.1,40.1,41.1,41.6]
  },
  hokkaido: {
    lon: [139.8,140.6,141.6,142.6,143.6,144.6,145.4,145.6,144.9,143.6,142.1,140.9,139.8],
    lat: [41.5,42.1,42.6,43.3,43.9,44.1,43.6,42.9,42.1,41.9,41.7,41.5,41.5]
  },
  kyushu: {
    lon: [129.7,130.3,130.9,131.6,131.9,131.6,130.9,130.3,129.5,129.7],
    lat: [33.6,33.9,33.7,33.1,32.3,31.6,31.3,31.6,32.6,33.6]
  },
  shikoku: {
    lon: [132.0,133.1,134.1,134.6,134.3,133.6,132.6,132.0],
    lat: [34.1,34.3,34.1,33.7,33.3,33.1,33.4,34.1]
  }
};

const japanTrench = {
  lon: [142.0,142.5,143.0,143.5,144.0,144.5,145.0],
  lat: [35.0,36.5,38.0,39.5,41.0,42.0,43.0]
};
const nankai = {
  lon: [132.0,133.0,134.0,135.0,136.0,137.0,138.0,139.0],
  lat: [31.0,31.5,32.0,32.5,33.0,33.5,34.0,34.5]
};

// ワイヤーフレーム生成関数
function makeWireframe(lonMin, lonMax, latMin, latMax, depthFn, steps = 10) {
  const traces = [];

  // 経度方向
  for (let i = 0; i <= steps; i++) {
    const lat = latMin + (latMax - latMin) * i / steps;
    const x = [], y = [], z = [];
    for (let j = 0; j <= steps; j++) {
      const lon = lonMin + (lonMax - lonMin) * j / steps;
      x.push(lon);
      y.push(lat);
      z.push(depthFn(lon, lat));
    }
    traces.push({ x, y, z });
  }

  // 緯度方向
  for (let j = 0; j <= steps; j++) {
    const lon = lonMin + (lonMax - lonMin) * j / steps;
    const x = [], y = [], z = [];
    for (let i = 0; i <= steps; i++) {
      const lat = latMin + (latMax - latMin) * i / steps;
      x.push(lon);
      y.push(lat);
      z.push(depthFn(lon, lat));
    }
    traces.push({ x, y, z });
  }
  return traces;
}

// ===== 各プレートのワイヤーフレーム =====
// 太平洋プレート（海洋プレート・沈み込み）
const pacWires = makeWireframe(138, 145.5, 34.5, 43.5, (lon) => Math.max(-280, Math.min(0, -(144.2 - lon) * 38)));

// フィリピン海プレート
const phsWires = makeWireframe(131.5, 140.5, 29.5, 36.5, (lon, lat) => Math.max(-140, Math.min(0, -(lat - 31.8) * 48)));

// オホーツクプレート（大陸側・浅い）
const okhWires = makeWireframe(139.5, 149, 40, 48, (lon, lat) => {
  // ほぼ水平だが、日本海溝寄りで少し深くなる
  const dist = Math.max(0, 145 - lon);
  return Math.max(-60, -8 - dist * 3);
});

// アムールプレート（大陸側・浅い）
const amurWires = makeWireframe(128, 140, 34, 45, (lon, lat) => {
  // 日本海側は浅い、太平洋側に近づくと少し沈む
  const dist = Math.max(0, lon - 136);
  return Math.max(-40, -5 - dist * 2.5);
});

// 震源データ
const quakes = [
  {lon:141.9, lat:38.3, z:-52, mag:4.5, title:"M4.5 宮城県沖", detail:"女川町東方沖<br>深さ 約52km<br>発生：直近24時間以内"},
  {lon:137.69, lat:34.86, z:-38, mag:5.6, title:"M5.6 静岡県西部", detail:"浜北付近<br>深さ 約38km<br>発生：11月8日 01:04頃"},
  {lon:142.7, lat:40.3, z:-20, mag:4.1, title:"M4.1 岩手県沖", detail:"岩手県沖<br>深さ 約20km"},
  {lon:130.5, lat:32.5, z:-10, mag:4.5, title:"M4.5 熊本・天草付近", detail:"熊本県天草・芦北地方付近<br>深さ 約10km"},
  {lon:141.5, lat:39.0, z:-30, mag:3.8, title:"M3.8 東北沖", detail:"東北地方沖<br>深さ 約30km"}
];

const traces = [];

// 日本列島
traces.push({
  type: 'scatter3d', mode: 'lines',
  x: japan.honshu.lon, y: japan.honshu.lat, z: Array(japan.honshu.lon.length).fill(4),
  line: { color: '#00f0ff', width: 6 }, hoverinfo: 'skip', showlegend: false
});
traces.push({
  type: 'scatter3d', mode: 'lines',
  x: japan.hokkaido.lon, y: japan.hokkaido.lat, z: Array(japan.hokkaido.lon.length).fill(4),
  line: { color: '#00f0ff', width: 5 }, hoverinfo: 'skip', showlegend: false
});
traces.push({
  type: 'scatter3d', mode: 'lines',
  x: japan.kyushu.lon, y: japan.kyushu.lat, z: Array(japan.kyushu.lon.length).fill(4),
  line: { color: '#00f0ff', width: 5 }, hoverinfo: 'skip', showlegend: false
});
traces.push({
  type: 'scatter3d', mode: 'lines',
  x: japan.shikoku.lon, y: japan.shikoku.lat, z: Array(japan.shikoku.lon.length).fill(4),
  line: { color: '#00f0ff', width: 4 }, hoverinfo: 'skip', showlegend: false
});

// 海溝
traces.push({
  type: 'scatter3d', mode: 'lines',
  x: japanTrench.lon, y: japanTrench.lat, z: Array(7).fill(0),
  line: { color: '#ff003c', width: 7 }, hoverinfo: 'skip', showlegend: false
});
traces.push({
  type: 'scatter3d', mode: 'lines',
  x: nankai.lon, y: nankai.lat, z: Array(8).fill(0),
  line: { color: '#ff00aa', width: 6 }, hoverinfo: 'skip', showlegend: false
});

// 太平洋プレート（シアン）
pacWires.forEach(w => {
  traces.push({
    type: 'scatter3d', mode: 'lines',
    x: w.x, y: w.y, z: w.z,
    line: { color: '#00f0ff', width: 1.8 },
    opacity: 0.75,
    hoverinfo: 'skip',
    showlegend: false
  });
});

// フィリピン海プレート（マゼンタ）
phsWires.forEach(w => {
  traces.push({
    type: 'scatter3d', mode: 'lines',
    x: w.x, y: w.y, z: w.z,
    line: { color: '#ff00aa', width: 1.8 },
    opacity: 0.75,
    hoverinfo: 'skip',
    showlegend: false
  });
});

// オホーツクプレート（黄緑）
okhWires.forEach(w => {
  traces.push({
    type: 'scatter3d', mode: 'lines',
    x: w.x, y: w.y, z: w.z,
    line: { color: '#88ff66', width: 1.6 },
    opacity: 0.7,
    hoverinfo: 'skip',
    showlegend: false
  });
});

// アムールプレート（紫）
amurWires.forEach(w => {
  traces.push({
    type: 'scatter3d', mode: 'lines',
    x: w.x, y: w.y, z: w.z,
    line: { color: '#aa88ff', width: 1.6 },
    opacity: 0.7,
    hoverinfo: 'skip',
    showlegend: false
  });
});

// 震源
traces.push({
  type: 'scatter3d',
  mode: 'markers',
  name: '震源',
  x: quakes.map(q => q.lon),
  y: quakes.map(q => q.lat),
  z: quakes.map(q => q.z),
  customdata: quakes.map(q => ({ title: q.title, detail: q.detail, mag: q.mag })),
  marker: {
    size: quakes.map(q => q.mag * 5.5),
    color: '#ff003c',
    opacity: 0.95,
    line: { width: 2, color: '#ffffff' }
  },
  hovertemplate: 'クリックで詳細表示<br>M%{customdata.mag}<extra></extra>'
});

// プレート名ラベル
traces.push({
  type: 'scatter3d', mode: 'text', showlegend: false,
  x: [146.5], y: [37.5], z: [12], text: ['太平洋プレート'],
  textfont: { size: 17, color: '#00f0ff', family: 'Noto Sans JP' }
});
traces.push({
  type: 'scatter3d', mode: 'text', showlegend: false,
  x: [134.5], y: [27.5], z: [12], text: ['フィリピン海プレート'],
  textfont: { size: 15, color: '#ff00aa', family: 'Noto Sans JP' }
});
traces.push({
  type: 'scatter3d', mode: 'text', showlegend: false,
  x: [144.5], y: [45.5], z: [18], text: ['オホーツクプレート'],
  textfont: { size: 16, color: '#88ff66', family: 'Noto Sans JP' }
});
traces.push({
  type: 'scatter3d', mode: 'text', showlegend: false,
  x: [132], y: [41], z: [18], text: ['アムールプレート'],
  textfont: { size: 16, color: '#aa88ff', family: 'Noto Sans JP' }
});

const layout = {
  paper_bgcolor: '#02040a',
  plot_bgcolor: '#02040a',
  font: { color: '#00f0ff', family: 'Noto Sans JP', size: 13 },
  scene: {
    xaxis: { title: '経度 (°E)', gridcolor: '#003344', zerolinecolor: '#005566', showbackground: true, backgroundcolor: '#03080f', range: [127, 150] },
    yaxis: { title: '緯度 (°N)', gridcolor: '#003344', zerolinecolor: '#005566', showbackground: true, backgroundcolor: '#03080f', range: [26, 49] },
    zaxis: { title: '深さ (km)', gridcolor: '#003344', zerolinecolor: '#005566', showbackground: true, backgroundcolor: '#03080f', range: [-300, 40] },
    aspectmode: 'manual',
    aspectratio: { x: 1.35, y: 1, z: 0.36 },
    camera: { eye: { x: 1.6, y: -1.9, z: 0.9 } },
    bgcolor: '#02040a'
  },
  margin: { l: 0, r: 0, t: 0, b: 0 },
  showlegend: false
};

const plotDiv = document.getElementById('plot');

Plotly.newPlot(plotDiv, traces, layout, {
  responsive: true,
  displayModeBar: true,
  modeBarButtonsToRemove: ['toImage', 'sendDataToCloud'],
  displaylogo: false
});

// クリックで情報表示
plotDiv.on('plotly_click', function(data) {
  const pt = data.points[0];
  if (pt && pt.customdata) {
    document.getElementById('info-title').innerHTML = pt.customdata.title;
    document.getElementById('info-body').innerHTML = pt.customdata.detail;
    document.getElementById('info-panel').style.display = 'block';
  }
});
</script>
</body>
</html>
