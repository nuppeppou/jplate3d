<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECTION-9 // TECTONIC NET // JAPAN</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #02040a;
    color: #00f0ff;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    height: 100vh;
  }

  /* スキャンライン */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 240, 255, 0.03) 2px,
      rgba(0, 240, 255, 0.03) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* ヘッダー */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
    background: linear-gradient(180deg, rgba(0,10,20,0.95) 0%, transparent 100%);
    padding: 14px 24px 30px;
    border-bottom: 1px solid #00f0ff33;
  }
  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.35rem;
    letter-spacing: 4px;
    color: #00f0ff;
    text-shadow: 0 0 12px #00f0ff, 0 0 30px #00f0ff55;
  }
  .subtitle {
    font-size: 0.75rem;
    color: #ff00aa;
    margin-top: 4px;
    letter-spacing: 2px;
  }
  .status {
    position: absolute;
    top: 18px; right: 24px;
    font-size: 0.7rem;
    color: #00ff9f;
    text-align: right;
  }
  .status span { opacity: 0.6; }

  /* プロット */
  #plot {
    width: 100%;
    height: 100vh;
  }

  /* フッター情報 */
  #footer {
    position: absolute;
    bottom: 12px; left: 20px;
    font-size: 0.65rem;
    color: #00f0ff88;
    z-index: 20;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="title">SECTION-9 // TECTONIC NET</div>
  <div class="subtitle">JAPAN PLATE BOUNDARY + RECENT SEISMIC ACTIVITY</div>
  <div class="status">
    SYSTEM ONLINE<br>
    <span>DEPTH EXAGGERATED ×3.5</span>
  </div>
</div>

<div id="plot"></div>

<div id="footer">
  PACIFIC PLATE → CYAN　｜　PHILIPPINE SEA PLATE → MAGENTA<br>
  RED SPHERES = RECENT QUAKES (SIZE ∝ MAGNITUDE)
</div>

<script>
// ===== より詳細な日本列島輪郭 =====
const japan = {
  // 本州（かなり詳細）
  honshu: {
    lon: [141.0,141.5,142.0,142.3,141.8,141.2,140.8,140.2,139.5,138.8,137.8,136.9,136.0,135.2,134.5,133.8,133.0,132.2,131.5,131.0,130.8,131.2,132.0,133.0,134.0,135.0,136.0,137.0,138.0,139.0,140.0,140.8,141.0],
    lat: [41.5,41.0,40.2,39.0,38.0,37.2,36.5,35.8,35.2,34.8,34.6,34.4,34.5,34.7,34.5,34.0,33.6,33.5,33.8,34.2,34.8,35.5,35.8,36.2,36.5,36.8,37.0,37.5,38.2,39.0,40.0,41.0,41.5]
  },
  // 北海道
  hokkaido: {
    lon: [139.8,140.5,141.5,142.5,143.5,144.5,145.3,145.5,144.8,143.5,142.0,140.8,139.8],
    lat: [41.5,42.0,42.5,43.2,43.8,44.0,43.5,42.8,42.0,41.8,41.6,41.5,41.5]
  },
  // 九州
  kyushu: {
    lon: [129.7,130.2,130.8,131.5,131.8,131.5,130.8,130.2,129.5,129.7],
    lat: [33.5,33.8,33.6,33.0,32.2,31.5,31.2,31.5,32.5,33.5]
  },
  // 四国
  shikoku: {
    lon: [132.0,133.0,134.0,134.5,134.2,133.5,132.5,132.0],
    lat: [34.0,34.2,34.0,33.6,33.2,33.0,33.3,34.0]
  }
};

// 海溝ライン
const japanTrench = {
  lon: [142.0,142.5,143.0,143.5,144.0,144.5,145.0],
  lat: [35.0,36.5,38.0,39.5,41.0,42.0,43.0]
};
const nankai = {
  lon: [132.0,133.0,134.0,135.0,136.0,137.0,138.0,139.0],
  lat: [31.0,31.5,32.0,32.5,33.0,33.5,34.0,34.5]
};

// スラブ用グリッド生成
function makeSlab(lonMin, lonMax, latMin, latMax, depthFn, steps=28) {
  const x=[], y=[], z=[];
  for(let i=0; i<steps; i++){
    for(let j=0; j<steps; j++){
      const lon = lonMin + (lonMax-lonMin)*j/(steps-1);
      const lat = latMin + (latMax-latMin)*i/(steps-1);
      x.push(lon); y.push(lat); z.push(depthFn(lon,lat));
    }
  }
  return {x,y,z};
}

const pac = makeSlab(138,145,35,43, (lon,lat)=> Math.max(-280, Math.min(0, -(144-lon)*38)));
const phs = makeSlab(132,140,30,36, (lon,lat)=> Math.max(-140, Math.min(0, -(lat-32)*48)));

// 地震（直近）
const quakes = [
  {lon:141.9, lat:38.3, z:-52, mag:4.5, label:"M4.5  MIYAGI OFFSHORE"},
  {lon:137.69, lat:34.86, z:-38, mag:5.6, label:"M5.6  W-SHIZUOKA"},
  {lon:142.7, lat:40.3, z:-20, mag:4.1, label:"M4.1  IWATE OFFSHORE"},
  {lon:130.5, lat:32.5, z:-10, mag:4.5, label:"M4.5  KYUSHU"},
  {lon:141.5, lat:39.0, z:-30, mag:3.8, label:"M3.8  TOHOKU"}
];

const traces = [
  // 日本列島（ネオンシアン）
  {type:'scatter3d', mode:'lines', name:'HONSHU',
   x:japan.honshu.lon, y:japan.honshu.lat, z:Array(japan.honshu.lon.length).fill(2),
   line:{color:'#00f0ff', width:6}, hoverinfo:'skip'},
  {type:'scatter3d', mode:'lines', name:'HOKKAIDO',
   x:japan.hokkaido.lon, y:japan.hokkaido.lat, z:Array(japan.hokkaido.lon.length).fill(2),
   line:{color:'#00f0ff', width:5}, hoverinfo:'skip'},
  {type:'scatter3d', mode:'lines', name:'KYUSHU',
   x:japan.kyushu.lon, y:japan.kyushu.lat, z:Array(japan.kyushu.lon.length).fill(2),
   line:{color:'#00f0ff', width:5}, hoverinfo:'skip'},
  {type:'scatter3d', mode:'lines', name:'SHIKOKU',
   x:japan.shikoku.lon, y:japan.shikoku.lat, z:Array(japan.shikoku.lon.length).fill(2),
   line:{color:'#00f0ff', width:4}, hoverinfo:'skip'},

  // 海溝
  {type:'scatter3d', mode:'lines', name:'JAPAN TRENCH',
   x:japanTrench.lon, y:japanTrench.lat, z:Array(7).fill(0),
   line:{color:'#ff003c', width:7}, hoverinfo:'skip'},
  {type:'scatter3d', mode:'lines', name:'NANKAI TROUGH',
   x:nankai.lon, y:nankai.lat, z:Array(8).fill(0),
   line:{color:'#ff00aa', width:6}, hoverinfo:'skip'},

  // 太平洋スラブ
  {type:'mesh3d', name:'PACIFIC SLAB',
   x:pac.x, y:pac.y, z:pac.z,
   intensity:pac.z, colorscale:[[0,'#001a33'],[0.5,'#0066aa'],[1,'#00f0ff']],
   opacity:0.55, showscale:false, hoverinfo:'skip'},

  // フィリピン海スラブ
  {type:'mesh3d', name:'PHILIPPINE SEA SLAB',
   x:phs.x, y:phs.y, z:phs.z,
   intensity:phs.z, colorscale:[[0,'#1a001a'],[0.5,'#aa0066'],[1,'#ff00aa']],
   opacity:0.55, showscale:false, hoverinfo:'skip'},

  // 地震
  {type:'scatter3d', mode:'markers+text', name:'SEISMIC EVENTS',
   x:quakes.map(q=>q.lon), y:quakes.map(q=>q.lat), z:quakes.map(q=>q.z),
   text:quakes.map(q=>q.label),
   textposition:'top center',
   textfont:{size:11, color:'#ffffff', family:'Share Tech Mono'},
   marker:{
     size:quakes.map(q=>q.mag*5),
     color:'#ff003c',
     opacity:0.95,
     line:{width:2, color:'#ffffff'},
     symbol:'circle'
   },
   hovertemplate:'%{text}<br>%{x:.2f}°E  %{y:.2f}°N<br>DEPTH %{z:.0f} km<extra></extra>'
  },

  // プレート名
  {type:'scatter3d', mode:'text', showlegend:false,
   x:[147], y:[38], z:[8], text:['PACIFIC'],
   textfont:{size:16, color:'#00f0ff', family:'Orbitron'}},
  {type:'scatter3d', mode:'text', showlegend:false,
   x:[135], y:[27], z:[8], text:['PHILIPPINE SEA'],
   textfont:{size:14, color:'#ff00aa', family:'Orbitron'}},
  {type:'scatter3d', mode:'text', showlegend:false,
   x:[134], y:[39], z:[12], text:['EURASIA / AMUR'],
   textfont:{size:13, color:'#aa88ff', family:'Orbitron'}},
  {type:'scatter3d', mode:'text', showlegend:false,
   x:[143], y:[45], z:[12], text:['OKHOTSK'],
   textfont:{size:13, color:'#88ffaa', family:'Orbitron'}}
];

const layout = {
  paper_bgcolor: '#02040a',
  plot_bgcolor: '#02040a',
  font: {color: '#00f0ff', family: 'Share Tech Mono'},
  scene: {
    xaxis: {title: {text:'LONGITUDE', font:{size:11}}, gridcolor:'#003344', zerolinecolor:'#005566', showbackground:true, backgroundcolor:'#03080f'},
    yaxis: {title: {text:'LATITUDE', font:{size:11}}, gridcolor:'#003344', zerolinecolor:'#005566', showbackground:true, backgroundcolor:'#03080f'},
    zaxis: {title: {text:'DEPTH (km)', font:{size:11}}, gridcolor:'#003344', zerolinecolor:'#005566', showbackground:true, backgroundcolor:'#03080f'},
    aspectmode: 'manual',
    aspectratio: {x:1.25, y:1, z:0.32},
    camera: {eye: {x:1.55, y:-1.85, z:0.85}},
    bgcolor: '#02040a'
  },
  margin: {l:0, r:0, t:0, b:0},
  showlegend: false
};

Plotly.newPlot('plot', traces, layout, {
  responsive: true,
  displayModeBar: true,
  modeBarButtonsToRemove: ['toImage','sendDataToCloud'],
  displaylogo: false
});
</script>
</body>
</html>
