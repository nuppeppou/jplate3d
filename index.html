<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本周辺 プレート＆地震 3Dビジュアライザー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-slate-100 flex h-full w-full">

  <!-- 3D WebGL Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Left Sidebar Toggle Button (Always visible on top of canvas/sidebar) -->
  <button id="btn-toggle-sidebar" class="fixed top-4 left-4 z-30 flex items-center justify-center w-10 h-10 rounded-xl glass-panel text-slate-200 hover:text-cyan-300 hover:border-cyan-500/50 shadow-2xl transition-all duration-300 focus:outline-none" title="地震一覧の表示/非表示 (Hキー)">
    <span id="sidebar-toggle-icon" class="text-base font-bold transition-transform duration-300">◀</span>
  </button>

  <!-- Left Sidebar (Quake Feed & Controls) -->
  <aside id="sidebar" class="relative z-10 w-80 md:w-96 h-full flex flex-col glass-panel border-r border-slate-700/60 shadow-2xl transition-transform duration-300 ease-in-out">
    <!-- Header -->
    <header class="p-4 pl-16 border-b border-slate-700/60 bg-slate-900/60">
      <div class="flex items-center justify-between mb-1">
        <h1 class="text-base font-bold text-white flex items-center gap-2">
          <span class="inline-block w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
          地震 ✕ プレート構造 3D
        </h1>
        <span id="quake-count-badge" class="text-xs bg-cyan-900/80 text-cyan-300 px-2 py-0.5 rounded-full border border-cyan-500/30">0件</span>
      </div>
      <p class="text-xs text-slate-400">地下深度を誇張表示（深さ50kmが立体的に深部に沈み込みます）</p>

      <!-- Tab Switcher -->
      <div class="grid grid-cols-2 gap-1 mt-3 bg-slate-950/70 p-1 rounded-lg border border-slate-800">
        <button id="btn-tab-realtime" class="py-1.5 text-xs font-semibold rounded-md bg-blue-600 text-white shadow transition-all">
          最新・直近地震
        </button>
        <button id="btn-tab-history" class="py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition-all">
          代表的な大地震
        </button>
      </div>
    </header>

    <!-- Filter & Refresh Bar -->
    <div class="px-4 py-2 bg-slate-900/40 border-b border-slate-800 flex items-center justify-between text-xs">
      <span id="data-status-text" class="text-slate-400">データ読込中...</span>
      <button id="btn-refresh" class="flex items-center gap-1 text-cyan-400 hover:text-cyan-300 font-medium px-2 py-1 rounded hover:bg-white/5 transition">
        <span>🔄 更新</span>
      </button>
    </div>

    <!-- Earthquake List -->
    <div id="quake-list-container" class="flex-1 overflow-y-auto custom-scroll p-2 space-y-1.5">
      <!-- Items dynamically injected -->
    </div>

    <!-- View & Display Controls Footer -->
    <footer class="p-3 bg-slate-950/80 border-t border-slate-800 space-y-2">
      <div class="flex items-center justify-between text-xs text-slate-400">
        <span>自動回転 (ゆっくり)</span>
        <button id="btn-toggle-rotate" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">
          一時停止
        </button>
      </div>
      <div class="flex gap-1.5">
        <button id="btn-view-north" class="flex-1 py-1 text-xs rounded bg-slate-800 hover:bg-cyan-900/50 hover:text-cyan-300 border border-slate-700 transition">
          北を上 (俯瞰)
        </button>
        <button id="btn-view-cross" class="flex-1 py-1 text-xs rounded bg-slate-800 hover:bg-cyan-900/50 hover:text-cyan-300 border border-slate-700 transition">
          沈み込み断面
        </button>
        <button id="btn-view-reset" class="flex-1 py-1 text-xs rounded bg-slate-800 hover:bg-cyan-900/50 hover:text-cyan-300 border border-slate-700 transition">
          初期視点
        </button>
      </div>
    </footer>
  </aside>

  <!-- 3D Tooltip (Hover) -->
  <div id="tooltip" class="absolute z-20 pointer-events-none hidden glass-panel px-3 py-2 rounded-lg text-xs shadow-xl border border-cyan-500/40 transform -translate-x-1/2 -translate-y-full mb-3 transition-opacity">
    <div id="tooltip-title" class="font-bold text-white mb-0.5"></div>
    <div id="tooltip-time" class="text-cyan-300 text-[11px] mb-1"></div>
    <div id="tooltip-meta" class="text-slate-300 space-y-0.5"></div>
  </div>

  <!-- Detail Modal on Click -->
  <div id="detail-modal" class="absolute z-30 bottom-5 right-5 max-w-sm w-full hidden glass-panel rounded-xl p-4 shadow-2xl border border-cyan-500/50">
    <div class="flex justify-between items-start mb-2">
      <div>
        <span id="modal-badge" class="inline-block px-2 py-0.5 text-xs font-bold rounded bg-red-600 text-white mb-1">震度</span>
        <h3 id="modal-place" class="text-base font-bold text-white">震源地名</h3>
      </div>
      <button id="btn-close-modal" class="text-slate-400 hover:text-white text-lg px-1.5">✕</button>
    </div>

    <!-- DateTime Section (Clear Display) -->
    <div class="bg-slate-950/70 p-2.5 rounded-lg border border-slate-800 mb-3 space-y-1">
      <div class="text-[11px] text-slate-400">発生日時 (年月日・時間)</div>
      <div id="modal-datetime" class="text-sm font-semibold text-cyan-300">2026年 --月--日 --:--:--</div>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-2 gap-2 text-xs mb-3">
      <div class="bg-slate-900/60 p-2 rounded border border-slate-800">
        <span class="text-slate-400 block text-[10px]">マグニチュード</span>
        <span id="modal-magnitude" class="text-sm font-bold text-yellow-400">M -.-</span>
      </div>
      <div class="bg-slate-900/60 p-2 rounded border border-slate-800">
        <span class="text-slate-400 block text-[10px]">震源の深さ</span>
        <span id="modal-depth" class="text-sm font-bold text-emerald-400">-- km</span>
      </div>
    </div>

    <div class="text-xs text-slate-300 bg-slate-900/40 p-2.5 rounded border border-slate-800/80 leading-relaxed">
      <span class="text-cyan-400 font-semibold block mb-0.5">プレートテクトニクス的背景:</span>
      <span id="modal-tectonics">--</span>
    </div>
  </div>

  <!-- Legend Overlay -->
  <div class="absolute top-4 right-4 z-10 glass-panel px-3.5 py-2.5 rounded-xl text-xs space-y-1.5 shadow-lg border border-slate-700/60 pointer-events-none hidden sm:block">
    <div class="font-bold text-slate-200 border-b border-slate-700/60 pb-1 mb-1">深さカラー (垂直位置誇張)</div>
    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-500 shadow-sm shadow-red-500/50"></span><span>ごく浅い (0〜30km)</span></div>
    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-500"></span><span>浅発・境界 (30〜70km)</span></div>
    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500"></span><span>中発スラブ内 (70〜150km)</span></div>
    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-500"></span><span>深発地震 (150km超〜700km)</span></div>
  </div>

  <script>
    // --- 1. Scene & Engine Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030712);
    scene.fog = new THREE.FogExp2(0x030712, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    // 初期視点: 北海道が上（真北）に見える南側からの斜め見下ろし
    camera.position.set(0, 26, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2 + 0.15; // 地下も覗ける
    controls.minDistance = 6;
    controls.maxDistance = 80;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xe0f2fe, 1.2);
    dirLight1.position.set(15, 35, 20);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.6);
    dirLight2.position.set(-20, -10, -15);
    scene.add(dirLight2);

    // Main World Group (Rotated slowly)
    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // --- 2. Coordinate Transformation (Geographic to 3D with EXAGGERATED DEPTH) ---
    // 基準点: 36.5°N, 137.5°E (日本列島中心)
    const CENTER_LAT = 36.5;
    const CENTER_LON = 137.5;
    const SCALE_DEG = 1.35; // 1度あたりの3D距離
    
    // 【重要】深さの誇張係数: 50kmで約-3.2ユニット、100kmで-6.5ユニット
    function depthKmToY(depthKm) {
      return - (depthKm / 15.4);
    }

    // 地震調査研究推進本部・Slab2モデル準拠のプレート上面深度計算
    // 太平洋プレートおよびフィリピン海プレートのスラブ幾何学を共通定義
    function getSlabData(lat, lon) {
      // 1. 太平洋プレート (千島・日本海溝・伊豆小笠原から西北西へ沈み込み)
      // 日本海溝線の概略ライン: 経度 lonTrench
      let trenchLonPac = 143.5 - (lat - 38.0) * 0.45;
      if (lat < 35.0) {
        // 伊豆・小笠原海溝沿い
        trenchLonPac = 141.0 + (35.0 - lat) * 0.1;
      }
      const distFromPacTrench = trenchLonPac - lon; // 海溝より西（正）なら沈み込み域

      if (distFromPacTrench >= 0 && (lon >= 133.0 || lat >= 35.0)) {
        // 海溝近傍から大陸側へ進むにつれて傾斜角が増加 (スラブ上面深度 km)
        let slabTopKm = 15.0 + Math.pow(distFromPacTrench * 1.05, 1.48) * 22.0;
        if (lat < 35.0 && lon < 140.0) slabTopKm += 25.0; // フィリピン海プレート下への深い沈み込み
        return {
          plate: 'PAC',
          topKm: Math.min(slabTopKm, 650),
          thicknessKm: 35.0 // 太平洋プレートの厚み (~35km)
        };
      }

      // 2. フィリピン海プレート (南海トラフ・琉球海溝から北西へ沈み込み)
      // 南海トラフ線の概略: latTrench
      const trenchLatPhs = 33.5 - (lon - 136.0) * 0.55;
      const distFromPhsTrough = lat - trenchLatPhs; // トラフより北西（正）なら沈み込み域

      if (distFromPhsTrough >= 0 && lat <= 36.5 && lon <= 139.0 && lon >= 129.0) {
        let slabTopKm = 12.0 + Math.pow(distFromPhsTrough * 1.15, 1.42) * 28.0;
        return {
          plate: 'PHS',
          topKm: Math.min(slabTopKm, 160),
          thicknessKm: 25.0 // フィリピン海プレートの厚み (~25km)
        };
      }

      return null;
    }

    function geoTo3D(lat, lon, depthKm = 0) {
      const x = (lon - CENTER_LON) * (SCALE_DEG * 0.85); // 緯度による東西収縮補正
      const z = -(lat - CENTER_LAT) * SCALE_DEG;         // 北が-Z、南が+Z
      const y = depthKmToY(depthKm);
      return new THREE.Vector3(x, y, z);
    }

    // --- 3. Build Geologic Base Block & Japan Surface Map ---
    const blockRadius = 18.0;
    const blockHeight = 24.0; // 地下深くまでのマントルブロック

    // Create Detailed High-Resolution Texture for Surface
    function createJapanMapTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 2048;
      const ctx = canvas.getContext('2d');

      // Ocean Deep Base
      const oceanGrad = ctx.createRadialGradient(1024, 1024, 100, 1024, 1024, 1000);
      oceanGrad.addColorStop(0, '#0a2540');
      oceanGrad.addColorStop(0.6, '#041728');
      oceanGrad.addColorStop(1, '#020b14');
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(0, 0, 2048, 2048);

      // Coordinate converter on texture
      function toCanvasPx(lat, lon) {
        const v = geoTo3D(lat, lon, 0);
        // v.x [-blockRadius, blockRadius] -> [0, 2048]
        const px = ((v.x / (blockRadius * 2)) + 0.5) * 2048;
        const py = ((v.z / (blockRadius * 2)) + 0.5) * 2048;
        return { x: px, y: py };
      }

      // Draw Landmasses (High precision silhouette)
      function drawPolygon(coords, fill, stroke) {
        ctx.beginPath();
        coords.forEach(([lat, lon], idx) => {
          const pt = toCanvasPx(lat, lon);
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }
      }

      // Asian Continent / Korea (Amur Plate part)
      const continent = [
        [46, 126], [43, 129], [40, 128], [37.5, 126.5], [35, 128.5], [34.5, 127],
        [35.5, 126], [38, 124.5], [41, 124], [44, 124], [46, 124]
      ];
      drawPolygon(continent, '#1e3a2f', '#2dd4bf33');

      // Honshu
      const honshu = [
        [34.3, 131.0], [35.5, 133.0], [35.7, 135.5], [36.7, 136.5], [37.5, 137.4],
        [38.0, 138.5], [39.0, 139.9], [40.8, 140.0], [41.5, 140.9], [40.5, 141.5],
        [38.3, 141.1], [37.0, 141.0], [35.7, 140.8], [35.0, 139.8], [34.7, 138.2],
        [34.6, 137.0], [34.2, 136.8], [33.5, 135.8], [34.3, 135.1], [34.4, 132.5]
      ];
      drawPolygon(honshu, '#244535', '#4ade8066');

      // Hokkaido
      const hokkaido = [
        [41.8, 140.0], [42.3, 140.3], [43.3, 140.5], [45.5, 141.8], [44.4, 143.5],
        [44.0, 145.2], [43.3, 145.7], [43.0, 144.5], [42.0, 143.2], [42.2, 141.0]
      ];
      drawPolygon(hokkaido, '#224032', '#4ade8066');

      // Kyushu
      const kyushu = [
        [33.9, 130.9], [33.6, 130.3], [32.8, 130.1], [31.3, 130.5], [31.4, 131.4],
        [32.8, 131.9], [33.3, 131.7]
      ];
      drawPolygon(kyushu, '#244535', '#4ade8066');

      // Shikoku
      const shikoku = [
        [34.3, 134.1], [34.0, 134.6], [33.3, 134.2], [32.7, 133.0], [33.3, 132.1],
        [33.9, 132.7], [34.2, 133.4]
      ];
      drawPolygon(shikoku, '#244535', '#4ade8066');

      // Trench Lines (Japan Trench & Nankai Trough)
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 6]);

      // Japan Trench (Pacific Plate boundary)
      ctx.strokeStyle = '#38bdf8';
      ctx.beginPath();
      [[42, 146], [40, 144.5], [38, 143.8], [36, 142.5], [34, 141.5], [30, 141.0]].forEach(([la, lo], i) => {
        const p = toCanvasPx(la, lo);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();

      // Nankai Trough (Philippine Sea Plate boundary)
      ctx.strokeStyle = '#f43f5e';
      ctx.beginPath();
      [[35.0, 138.8], [34.0, 137.5], [33.0, 135.8], [32.0, 133.5], [30.5, 131.5]].forEach(([la, lo], i) => {
        const p = toCanvasPx(la, lo);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();
      ctx.setLineDash([]);

      // Subtle Lat/Lon grid
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      for (let lo = 125; lo <= 148; lo += 5) {
        ctx.beginPath();
        const p1 = toCanvasPx(24, lo);
        const p2 = toCanvasPx(47, lo);
        ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
      for (let la = 25; la <= 45; la += 5) {
        ctx.beginPath();
        const p1 = toCanvasPx(la, 124);
        const p2 = toCanvasPx(la, 150);
        ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      return new THREE.CanvasTexture(canvas);
    }

    // Top Surface Mesh (Semi-transparent so underground deep earthquakes are clearly visible)
    const surfaceGeo = new THREE.CircleGeometry(blockRadius, 72);
    const surfaceTex = createJapanMapTexture();
    const surfaceMat = new THREE.MeshStandardMaterial({
      map: surfaceTex,
      roughness: 0.7,
      metalness: 0.1,
      transparent: true,
      opacity: 0.68, // 地下が見通せる絶妙な透明度
      side: THREE.DoubleSide
    });
    const surfaceMesh = new THREE.Mesh(surfaceGeo, surfaceMat);
    surfaceMesh.rotation.x = -Math.PI / 2;
    surfaceMesh.position.y = 0;
    worldGroup.add(surfaceMesh);

    // Deep Crust Cylinder Cutaway (Side & Bottom)
    const cylGeo = new THREE.CylinderGeometry(blockRadius, blockRadius, blockHeight, 72, 1, true);
    const sideMat = new THREE.MeshStandardMaterial({
      color: 0x0f172a,
      roughness: 0.9,
      transparent: true,
      opacity: 0.45,
      side: THREE.BackSide
    });
    const cylMesh = new THREE.Mesh(cylGeo, sideMat);
    cylMesh.position.y = -blockHeight / 2;
    worldGroup.add(cylMesh);

    // --- 4. 3D Subducting Slabs (美しく自然な傾斜スラブの再構築) ---
    // 太平洋プレートのスラブ (日本海溝から西へ滑らかに沈み込むシンプルな曲面)
    function createPacificSlab() {
      const slabGroup = new THREE.Group();
      const rows = 24;
      const cols = 20;
      const geo = new THREE.PlaneGeometry(1, 1, cols - 1, rows - 1);
      const pos = geo.attributes.position;

      // 海溝の弧状カーブを基準にした規則的なグリッド
      let idx = 0;
      for (let j = 0; j < rows; j++) {
        const v = j / (rows - 1); // 南から北 (28°N〜45°N)
        const lat = 29.0 + v * 16.0;

        // 海溝の経度ライン
        let trenchLon = 143.2 - (lat - 38.0) * 0.4;
        if (lat < 35.0) trenchLon = 141.2 + (35.0 - lat) * 0.12;

        for (let i = 0; i < cols; i++) {
          const u = i / (cols - 1); // 0: 海溝(東) -> 1: 大陸地下深部(西)
          const lon = trenchLon - u * 9.5; 

          const vSurf = geoTo3D(lat, lon, 0);
          // 海溝(u=0)近傍は浅く、西へ潜るにつれて傾斜を増しながら深さ200km超へ
          const depthKm = 12.0 + Math.pow(u, 1.35) * 220.0;
          const y = depthKmToY(depthKm);

          pos.setXYZ(idx, vSurf.x, y, vSurf.z);
          idx++;
        }
      }
      geo.computeVertexNormals();

      // 半透明ソリッド面
      const mat = new THREE.MeshStandardMaterial({
        color: 0x0284c7,
        roughness: 0.3,
        transparent: true,
        opacity: 0.42,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(geo, mat);
      slabGroup.add(mesh);

      // 構造グリッドライン
      const wireMat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        wireframe: true,
        transparent: true,
        opacity: 0.25
      });
      const wireMesh = new THREE.Mesh(geo, wireMat);
      slabGroup.add(wireMesh);

      return slabGroup;
    }
    worldGroup.add(createPacificSlab());

    // フィリピン海プレートのスラブ (南海トラフ・琉球海溝から北西へ滑らかに沈み込む曲面)
    function createPhilippineSlab() {
      const slabGroup = new THREE.Group();
      const rows = 18;
      const cols = 16;
      const geo = new THREE.PlaneGeometry(1, 1, cols - 1, rows - 1);
      const pos = geo.attributes.position;

      let idx = 0;
      for (let j = 0; j < rows; j++) {
        const v = j / (rows - 1); // 南西から北東 (九州南〜伊豆)
        const latTrench = 30.2 + v * 4.8;
        const lonTrench = 131.0 + v * 7.5;

        for (let i = 0; i < cols; i++) {
          const u = i / (cols - 1); // 0: 南海トラフ -> 1: 西日本地下 (北西方向へ沈降)
          const lat = latTrench + u * 3.6;
          const lon = lonTrench - u * 2.8;

          const vSurf = geoTo3D(lat, lon, 0);
          // 南海トラフ(u=0)から四国・近畿・中国地方下へ深さ100km超まで沈み込み
          const depthKm = 10.0 + Math.pow(u, 1.25) * 115.0;
          const y = Math.min(depthKmToY(depthKm), -0.15); // 地表から確実に下

          pos.setXYZ(idx, vSurf.x, y, vSurf.z);
          idx++;
        }
      }
      geo.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        color: 0xf43f5e,
        roughness: 0.35,
        transparent: true,
        opacity: 0.4,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(geo, mat);
      slabGroup.add(mesh);

      const wireMat = new THREE.MeshBasicMaterial({
        color: 0xfb7185,
        wireframe: true,
        transparent: true,
        opacity: 0.25
      });
      const wireMesh = new THREE.Mesh(geo, wireMat);
      slabGroup.add(wireMesh);

      return slabGroup;
    }
    worldGroup.add(createPhilippineSlab());

    // --- 5. 3D Floating Plate Name Badges ---
    function createPlateTextSprite(text, colorHex) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 128;
      const ctx = c.getContext('2d');

      // Rounded Glass Pill
      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.strokeStyle = colorHex;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.roundRect(10, 10, 492, 108, 24);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 38px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 64);

      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(4.8, 1.2, 1.0);
      return sprite;
    }

    const quakesGroup = new THREE.Group();

    let currentQuakesData = [];

    // 選択中の地震を赤く淡く点滅・パルスさせるハイライト用オブジェクト
    let activeHighlightMesh = null;
    let activeHighlightRing = null;

    function createHighlightEffects(posUnder, posSurface) {
      // 既存のハイライトをクリア
      clearHighlight();

      // 1. 地下震源球体の周囲に展開する淡い赤色パルス球体
      const pulseGeo = new THREE.SphereGeometry(1.2, 24, 24);
      const pulseMat = new THREE.MeshBasicMaterial({
        color: 0xff2222,
        transparent: true,
        opacity: 0.5,
        wireframe: false,
        side: THREE.BackSide
      });
      activeHighlightMesh = new THREE.Mesh(pulseGeo, pulseMat);
      activeHighlightMesh.position.copy(posUnder);
      quakesGroup.add(activeHighlightMesh);

      // 2. 地表（震央）で広がる淡い赤色波紋リング
      const ringGeo = new THREE.RingGeometry(0.3, 0.5, 32);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xff3333,
        transparent: true,
        opacity: 0.7,
        side: THREE.DoubleSide
      });
      activeHighlightRing = new THREE.Mesh(ringGeo, ringMat);
      activeHighlightRing.rotation.x = -Math.PI / 2;
      activeHighlightRing.position.copy(posSurface);
      activeHighlightRing.position.y += 0.05;
      quakesGroup.add(activeHighlightRing);
    }

    function clearHighlight() {
      if (activeHighlightMesh) {
        quakesGroup.remove(activeHighlightMesh);
        activeHighlightMesh.geometry.dispose();
        activeHighlightMesh.material.dispose();
        activeHighlightMesh = null;
      }
      if (activeHighlightRing) {
        quakesGroup.remove(activeHighlightRing);
        activeHighlightRing.geometry.dispose();
        activeHighlightRing.material.dispose();
        activeHighlightRing = null;
      }
    }

    // Color based on Depth
    function getDepthColor(depthKm) {
      if (depthKm <= 30) return 0xef4444;       // 浅い (赤)
      if (depthKm <= 70) return 0xf59e0b;       // 浅発〜プレート境界 (橙)
      if (depthKm <= 150) return 0x10b981;      // 中発 (エメラルド)
      return 0x3b82f6;                          // 深発スラブ地震 (青)
    }

    function renderQuakesTo3D(quakes) {
      clearHighlight();
      // Clear previous
      while (quakesGroup.children.length > 0) {
        quakesGroup.remove(quakesGroup.children[0]);
      }
      quakeInteractiveMeshes.length = 0;

      quakes.forEach((q, index) => {
        const rawDepth = (q.depth != null && q.depth >= 0) ? q.depth : 10;
        const mag = Math.max(q.magnitude || 4.0, 3.0);
        
        // 無理な補正を排し、観測深度をそのまま素直に誇張スケールで地下座標へ変換
        const posUnder = geoTo3D(q.lat, q.lon, rawDepth);
        const posSurface = geoTo3D(q.lat, q.lon, 0);

        const colorHex = getDepthColor(rawDepth);

        // A. 地表から地下震源への垂直深度ロッド (ピン)
        const lineGeo = new THREE.BufferGeometry().setFromPoints([posSurface, posUnder]);
        const lineMat = new THREE.LineBasicMaterial({
          color: colorHex,
          transparent: true,
          opacity: 0.85
        });
        const line = new THREE.Line(lineGeo, lineMat);
        quakesGroup.add(line);

        // B. 地表（震央）のマーカーリング
        const ringGeo = new THREE.RingGeometry(0.12, 0.22, 16);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.copy(posSurface);
        ring.position.y += 0.03;
        quakesGroup.add(ring);

        // C. 地下震源球体
        const radius = Math.min(0.22 + (mag - 3.0) * 0.13, 1.0);
        const sphereGeo = new THREE.SphereGeometry(radius, 20, 20);
        const sphereMat = new THREE.MeshStandardMaterial({
          color: colorHex,
          emissive: colorHex,
          emissiveIntensity: 0.7,
          roughness: 0.25
        });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.copy(posUnder);
        
        // 深さ40km以上の場合は水平ターゲットリングを表示
        if (rawDepth >= 40) {
          const depthDiscGeo = new THREE.RingGeometry(radius * 1.15, radius * 1.7, 24);
          const depthDiscMat = new THREE.MeshBasicMaterial({
            color: colorHex,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.6
          });
          const depthDisc = new THREE.Mesh(depthDiscGeo, depthDiscMat);
          depthDisc.rotation.x = -Math.PI / 2;
          depthDisc.position.copy(posUnder);
          quakesGroup.add(depthDisc);
        }

        sphere.userData = { quake: q, index: index, posUnder: posUnder, posSurface: posSurface };
        quakesGroup.add(sphere);
        quakeInteractiveMeshes.push(sphere);
      });
    }

    async function fetchRealtimeQuakes() {
      const statusText = document.getElementById('data-status-text');
      statusText.textContent = '気象庁地震APIから取得中...';
      try {
        const res = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=25');
        const data = await res.json();
        
        const list = [];
        data.forEach((item, idx) => {
          if (!item.earthquake || !item.earthquake.hypocenter) return;
          const hyp = item.earthquake.hypocenter;
          if (hyp.latitude === -200 || hyp.longitude === -200) return;

          const depthVal = (hyp.depth === -1 || hyp.depth == null) ? 10 : hyp.depth;
          const magVal = (hyp.magnitude === -1 || hyp.magnitude == null) ? 3.5 : hyp.magnitude;

          // Max scale formatting
          let scaleStr = '-';
          if (item.earthquake.maxScale) {
            const sc = item.earthquake.maxScale;
            if (sc === 10) scaleStr = '1';
            else if (sc === 20) scaleStr = '2';
            else if (sc === 30) scaleStr = '3';
            else if (sc === 40) scaleStr = '4';
            else if (sc === 45) scaleStr = '5弱';
            else if (sc === 50) scaleStr = '5強';
            else if (sc === 55) scaleStr = '6弱';
            else if (sc === 60) scaleStr = '6強';
            else if (sc === 70) scaleStr = '7';
          }

          list.push({
            id: `rt_${idx}`,
            time: item.earthquake.time || item.time,
            place: hyp.name || '震源地不明',
            lat: hyp.latitude,
            lon: hyp.longitude,
            depth: depthVal,
            magnitude: magVal,
            maxScale: scaleStr,
            tectonics: determineTectonics(hyp.latitude, hyp.longitude, depthVal)
          });
        });

        currentQuakesData = list;
        updateUIQuakeList(list);
        renderQuakesTo3D(list);
        statusText.textContent = `最新 ${list.length} 件 正常取得`;
      } catch (err) {
        console.error('API Fetch failed, using fallback:', err);
        statusText.textContent = '取得失敗（代表地震を表示）';
        loadTab('history');
      }
    }

    function determineTectonics(lat, lon, depth) {
      const slab = getSlabData(lat, lon);
      if (slab) {
        if (depth >= slab.topKm - 10) {
          const pName = slab.plate === 'PAC' ? '太平洋プレート' : 'フィリピン海プレート';
          return `【スラブ内地震】沈み込んだ${pName}のリソスフェア内部（深さ${depth}km）で発生した地震です。`;
        }
        if (Math.abs(depth - slab.topKm) <= 15) {
          const pName = slab.plate === 'PAC' ? '太平洋プレート' : 'フィリピン海プレート';
          return `【プレート境界型】${pName}と上載プレートの接触境界（アスペリティ）付近で発生した地震です。`;
        }
      }
      if (depth <= 25) {
        return '【内陸地殻内地震】陸側プレート（アムールプレート等）の浅い上部地殻・活断層帯で発生した地震です。';
      }
      return `地下深さ${depth}kmで発生した深発・スラブ関連地震です。`;
    }

    // --- 9. Modal & Focus Handling ---
    const detailModal = document.getElementById('detail-modal');
    document.getElementById('btn-close-modal').addEventListener('click', () => {
      detailModal.classList.add('hidden');
    });

    // カメラ移動用のアニメーション変数
    let cameraAnim = null;

    function focusQuake(q) {
      // Show detail modal with exact date/time
      detailModal.classList.remove('hidden');
      document.getElementById('modal-place').textContent = q.place;
      document.getElementById('modal-datetime').textContent = q.time;
      document.getElementById('modal-magnitude').textContent = `M ${Number(q.magnitude).toFixed(1)}`;
      document.getElementById('modal-depth').textContent = `${q.depth} km ${q.isIntraSlab ? '(スラブ内部に配置)' : ''}`;
      document.getElementById('modal-badge').textContent = `最大震度 ${q.maxScale}`;
      document.getElementById('modal-tectonics').textContent = q.tectonics;

      // 該当オブジェクトから座標を取得
      const matchedMesh = quakeInteractiveMeshes.find(m => m.userData.quake.id === q.id || (m.userData.quake.place === q.place && m.userData.quake.time === q.time));
      
      const localPos = matchedMesh ? matchedMesh.userData.posUnder : geoTo3D(q.lat, q.lon, q.depth);
      const surfacePos = matchedMesh ? matchedMesh.userData.posSurface : geoTo3D(q.lat, q.lon, 0);

      // 赤く淡い点滅パルスエフェクトを開始
      createHighlightEffects(localPos, surfacePos);

      // 震源のローカル座標をワールド座標（回転考慮）に変換
      const worldTarget = localPos.clone().applyMatrix4(worldGroup.matrixWorld);

      // 震源の深さと位置が一番よく見える斜め上空のオフセット位置を計算
      const elevationOffset = q.depth > 70 ? 8 : 12;
      const cameraOffset = new THREE.Vector3(7, elevationOffset, 11);
      const worldCamPos = worldTarget.clone().add(cameraOffset);

      // スムーズなカメラ移動アニメーションを設定
      cameraAnim = {
        startCam: camera.position.clone(),
        endCam: worldCamPos,
        startTarget: controls.target.clone(),
        endTarget: worldTarget,
        progress: 0,
        duration: 45
      };

      autoRotate = false;
      btnToggleRotate.textContent = '再開';
    }

    // --- 10. Hover Tooltip (Raycasting) ---
    const tooltip = document.getElementById('tooltip');

    window.addEventListener('mousemove', (e) => {

      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(quakeInteractiveMeshes);

      if (intersects.length > 0) {
        const q = intersects[0].object.userData.quake;
        tooltip.style.left = `${e.clientX}px`;
        tooltip.style.top = `${e.clientY}px`;

        toggleIcon.textContent = '▶';
        btnToggleSidebar.title = '地震一覧を表示 (Hキー)';
        btnToggleSidebar.style.left = '1rem';
      }
    }

    btnToggleSidebar.addEventListener('click', () => {
      setSidebarVisibility(!isSidebarOpen);
    });

    // キーボードショートカット (Hキーでトグル)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        // 入力フォームやモーダルフォーカス時を除外
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
          setSidebarVisibility(!isSidebarOpen);
        }
      }
    });

    document.getElementById('btn-tab-realtime').addEventListener('click', () => loadTab('realtime'));
    document.getElementById('btn-tab-history').addEventListener('click', () => loadTab('history'));

    // --- 12. Animation Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // 選択箇所の赤く淡い点滅・パルスアニメーション
      if (activeHighlightMesh) {
        const time = performance.now() * 0.0035; // 穏やかな脈動
        // 0.25〜0.6 の間で淡く点滅
        const pulse = 0.5 + 0.5 * Math.sin(time * 2);
        activeHighlightMesh.material.opacity = 0.2 + pulse * 0.35;
        
        // 呼吸するようにわずかに拡縮
        const s = 1.0 + 0.35 * pulse;
        activeHighlightMesh.scale.set(s, s, s);

        if (activeHighlightRing) {
          activeHighlightRing.material.opacity = 0.25 + pulse * 0.45;
          const sRing = 1.0 + 0.6 * pulse;
          activeHighlightRing.scale.set(sRing, sRing, 1.0);
        }
      }

      // カメラのスムーズ補間アニメーション
      if (cameraAnim) {
        cameraAnim.progress++;
        const t = Math.min(cameraAnim.progress / cameraAnim.duration, 1.0);
        // easeOutCubic
        const ease = 1 - Math.pow(1 - t, 3);

        camera.position.lerpVectors(cameraAnim.startCam, cameraAnim.endCam, ease);
        controls.target.lerpVectors(cameraAnim.startTarget, cameraAnim.endTarget, ease);

        if (t >= 1.0) {
          cameraAnim = null;
        }
      }

      // ゆっくりとした自転 (超微速: 0.0006)
      if (autoRotate) {
        worldGroup.rotation.y += 0.0006;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // Window Resize Handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initial Start
    window.onload = () => {
      loadTab('realtime');
      animate();
    };
  </script>
</body>
</html>
