<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>攻殻機動隊風｜日本周辺プレート＋地震 3D</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Noto+Sans+JP:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #02040a;
    color: #00f0ff;
    font-family: 'Noto Sans JP', sans-serif;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,240,255,0.03) 2px, rgba(0,240,255,0.03) 4px);
    pointer-events: none; z-index: 100;
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    background: linear-gradient(180deg, rgba(0,8,18,0.97) 0%, transparent 100%);
    padding: 18px 32px 40px;
    border-bottom: 1px solid #00f0ff44;
  }
  .title {
    font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
    font-size: 1.7rem; letter-spacing: 5px;
    color: #00f0ff;
    text-shadow: 0 0 14px #00f0ff, 0 0 40px #00f0ff66;
  }
  .subtitle { font-size: 0.95rem; color: #ff00aa; margin-top: 5px; letter-spacing: 2px; }
  .status {
    position: absolute; top: 20px; right: 32px;
    font-size: 0.85rem; color: #00ff9f; text-align: right; line-height: 1.5;
  }
  #plot { width: 100%; height: 100%; }
  #info-panel {
    position: absolute; bottom: 28px; right: 28px; width: 360px;
    background: rgba(0,12,24,0.94); border: 1px solid #00f0ff;
    box-shadow: 0 0 25px #00f0ff55; padding: 18px 22px; z-index: 30;
    display: none; font-size: 0.95rem; line-height: 1.65;
  }
  #info-panel h3 { color: #ff003c; font-size: 1.15rem; margin-bottom: 10px; }
  #info-panel .close {
    position: absolute; top: 10px; right: 14px; cursor: pointer;
    color: #00f0ff; font-size: 1.3rem;
  }
  #info-panel .close:hover { color: #ff00aa; }
  #footer {
    position: absolute; bottom: 16px; left: 24px;
    font-size: 0.8rem; color: #00f0ff99; z-index: 20; line-height: 1.55;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="title">SECTION-9 // 地殻プレート監視網</div>
  <div class="subtitle">日本周辺プレート境界 + 直近地震活動</div>
  <div class="status">システム稼働中<br>深さ誇張表示 ×3.5</div>
</div>

<div id="plot"></div>

<div id="info-panel">
  <div class="close" onclick="document.getElementById('info-panel').style.display='none'">×</div>
  <h3 id="info-title">震源情報</h3>
  <div id="info-body"></div>
</div>

<div id="footer">
  太平洋＝シアン　｜　フィリピン海＝マゼンタ　｜　オホーツク＝黄緑<br>
  アムール＝紫　｜　北米＝オレンジ　｜　赤い球をクリックで震源詳細
</div>

<script>
/* ===== より詳細な日本列島輪郭 ===== */
const japan = {
  // 本州（かなり詳細）
  honshu: {
    lon: [
      140.95,141.40,141.85,142.15,142.35,142.20,141.90,141.55,141.15,140.70,
      140.25,139.80,139.35,138.85,138.30,137.70,137.10,136.50,135.95,135.40,
      134.85,134.30,133.75,133.20,132.70,132.25,131.85,131.50,131.30,131.45,
      131.80,132.30,132.90,133.50,134.15,134.80,135.40,136.00,136.60,137.20,
      137.80,138.40,139.00,139.55,140.05,140.50,140.85,141.10,140.95
    ],
    lat: [
      41.55,41.20,40.70,40.10,39.40,38.70,38.00,37.40,36.85,36.35,
      35.90,35.50,35.15,34.90,34.75,34.70,34.75,34.90,35.05,34.95,
      34.70,34.40,34.15,34.00,33.95,34.15,34.50,34.90,35.30,35.70,
      36.05,36.30,36.50,36.65,36.80,36.95,37.10,37.30,37.55,37.85,
      38.20,38.60,39.05,39.55,40.05,40.55,41.00,41.40,41.55
    ]
  },
  // 北海道
  hokkaido: {
    lon: [
      139.75,140.20,140.70,141.25,141.85,142.50,143.15,143.80,144.40,144.95,
      145.35,145.55,145.40,144.90,144.20,143.40,142.60,141.80,141.10,140.50,
      140.00,139.75
    ],
    lat: [
      41.45,41.80,42.20,42.55,42.90,43.25,43.55,43.80,43.95,43.85,
      43.50,42.95,42.40,42.00,41.80,41.70,41.65,41.55,41.50,41.45,
      41.40,41.45
    ]
  },
  // 九州
  kyushu: {
    lon: [
      129.65,130.05,130.50,131.00,131.45,131.75,131.85,131.60,131.15,130.60,
      130.10,129.70,129.50,129.55,129.65
    ],
    lat: [
      33.55,33.80,33.75,33.40,32.95,32.40,31.80,31.35,31.15,31.25,
      31.55,32.00,32.55,33.15,33.55
    ]
  },
  // 四国
  shikoku: {
    lon: [
      132.05,132.60,133.20,133.80,134.30,134.55,134.40,133.90,133.30,132.70,
      132.25,132.05
    ],
    lat: [
      34.05,34.20,34.15,33.95,33.70,33.35,33.05,32.95,33.05,33.25,
      33.60,34.05
    ]
  }
};

const japanTrench = {
  lon: [142.0,142.4,142.9,143.4,143.9,144.4,144.9,145.3],
  lat: [35.0,36.2,37.5,38.8,40.0,41.1,42.0,42.8]
};
const nankai = {
  lon: [131.8,132.6,133.5,134.4,135.3,136.2,137.1,138.0,138.8],
  lat: [30.8,31.3,31.8,32.3,32.8,33.3,33.8,34.3,34.7]
};

/* ワイヤーフレーム生成 */
function makeWireframe(lonMin, lonMax, latMin, latMax, depthFn, steps = 9) {
  const traces = [];
  for (let i = 0; i <= steps; i++) {
    const lat = latMin + (latMax - latMin) * i / steps;
    const x = [], y = [], z = [];
    for (let j = 0; j <= steps; j++) {
      const lon = lonMin + (lonMax - lonMin) * j / steps;
      x.push(lon); y.push(lat); z.push(depthFn(lon, lat));
    }
    traces.push({ x, y, z });
  }
  for (let j = 0; j <= steps; j++) {
    const lon = lonMin + (lonMax - lonMin) * j / steps;
    const x = [], y = [], z = [];
    for (let i = 0; i <= steps; i++) {
      const lat = latMin + (latMax - latMin) * i / steps;
      x.push(lon); y.push(lat); z.push(depthFn(lon, lat));
    }
    traces.push({ x, y, z });
  }
  return traces;
}

/* ===== 各プレート ===== */
const pacWires  = makeWireframe(138.0, 146.0, 34.0, 44.0, lon => Math.max(-280, Math.min(0, -(144.3 - lon) * 37)));
const phsWires  = makeWireframe(131.0, 140.5, 29.0, 36.5, (lon, lat) => Math.max(-140, Math.min(0, -(lat - 31.5) * 46)));
const okhWires  = makeWireframe(139.5, 149.0, 39.5, 47.5, (lon, lat) => Math.max(-55, -6 - Math.max(0, 145.5 - lon) * 2.8));
const amurWires = makeWireframe(127.5, 140.0, 33.5, 45.0, (lon, lat) => Math.max(-35, -4 - Math.max(0, lon - 136) * 2.2));
const namWires  = makeWireframe(142.0, 155.0, 44.0, 52.0, (lon, lat) => Math.max(-40, -5 - Math.max(0, 148 - lon) * 1.5)); // 北米プレート

const quakes = [
  {lon:141.9, lat:38.3, z:-52, mag:4.5, title:"M4.5 宮城県沖", detail:"女川町東方沖<br>深さ 約52km<br>発生：直近24時間以内"},
  {lon:137.69, lat:34.86, z:-38, mag:5.6, title:"M5.6 静岡県西部", detail:"浜北付近<br>深さ 約38km<br>発生：11月8日 01:04頃"},
  {lon:142.7, lat:40.3, z:-20, mag:4.1, title:"M4.1 岩手県沖", detail:"岩手県沖<br>深さ 約20km"},
  {lon:130.5, lat:32.5, z:-10, mag:4.5, title:"M4.5 熊本・天草付近", detail:"熊本県天草・芦北地方付近<br>深さ 約10km"},
  {lon:141.5, lat:39.0, z:-30, mag:3.8, title:"M3.8 東北沖", detail:"東北地方沖<br>深さ 約30km"}
];

const traces = [];

/* 日本列島（詳細版） */
['honshu','hokkaido','kyushu','shikoku'].forEach(name => {
  const d = japan[name];
  traces.push({
    type: 'scatter3d', mode: 'lines',
    x: d.lon, y: d.lat, z: Array(d.lon.length).fill(5),
    line: { color: '#00f0ff', width: name === 'honshu' ? 5.5 : 4.5 },
    hoverinfo: 'skip', showlegend: false
  });
});

/* 海溝 */
traces.push({
  type: 'scatter3d', mode: 'lines',
  x: japanTrench.lon, y: japanTrench.lat, z: Array(japanTrench.lon.length).fill(0),
  line: { color: '#ff003c', width: 6.5 }, hoverinfo: 'skip', showlegend: false
});
traces.push({
  type: 'scatter3d', mode: 'lines',
  x: nankai.lon, y: nankai.lat, z: Array(nankai.lon.length).fill(0),
  line: { color: '#ff00aa', width: 5.5 }, hoverinfo: 'skip', showlegend: false
});

/* プレートワイヤー */
function addWires(wires, color, opacity = 0.72) {
  wires.forEach(w => {
    traces.push({
      type: 'scatter3d', mode: 'lines',
      x: w.x, y: w.y, z: w.z,
      line: { color, width: 1.6 },
      opacity, hoverinfo: 'skip', showlegend: false
    });
  });
}

addWires(pacWires,  '#00f0ff');   // 太平洋
addWires(phsWires,  '#ff00aa');   // フィリピン海
addWires(okhWires,  '#88ff66');   // オホーツク
addWires(amurWires, '#aa88ff');   // アムール
addWires(namWires,  '#ffaa44');   // 北米

/* 震源 */
traces.push({
  type: 'scatter3d', mode: 'markers', name: '震源',
  x: quakes.map(q => q.lon),
  y: quakes.map(q => q.lat),
  z: quakes.map(q => q.z),
  customdata: quakes.map(q => ({ title: q.title, detail: q.detail, mag: q.mag })),
  marker: {
    size: quakes.map(q => q.mag * 5.2),
    color: '#ff003c',
    opacity: 0.95,
    line: { width: 2, color: '#ffffff' }
  },
  hovertemplate: 'クリックで詳細表示<br>M%{customdata.mag}<extra></extra>'
});

/* プレート名 */
const labels = [
  {x:146.8, y:37.0, z:15, text:'太平洋プレート', color:'#00f0ff'},
  {x:134.0, y:27.0, z:15, text:'フィリピン海プレート', color:'#ff00aa'},
  {x:145.0, y:45.5, z:20, text:'オホーツクプレート', color:'#88ff66'},
  {x:131.5, y:41.5, z:20, text:'アムールプレート', color:'#aa88ff'},
  {x:149.0, y:48.5, z:22, text:'北米プレート', color:'#ffaa44'}
];
labels.forEach(l => {
  traces.push({
    type: 'scatter3d', mode: 'text', showlegend: false,
    x: [l.x], y: [l.y], z: [l.z], text: [l.text],
    textfont: { size: 15, color: l.color, family: 'Noto Sans JP' }
  });
});

const layout = {
  paper_bgcolor: '#02040a',
  plot_bgcolor: '#02040a',
  font: { color: '#00f0ff', family: 'Noto Sans JP', size: 12 },
  scene: {
    xaxis: { title: '経度 (°E)', gridcolor: '#003344', zerolinecolor: '#005566', showbackground: true, backgroundcolor: '#03080f', range: [126, 156] },
    yaxis: { title: '緯度 (°N)', gridcolor: '#003344', zerolinecolor: '#005566', showbackground: true, backgroundcolor: '#03080f', range: [26, 53] },
    zaxis: { title: '深さ (km)', gridcolor: '#003344', zerolinecolor: '#005566', showbackground: true, backgroundcolor: '#03080f', range: [-300, 45] },
    aspectmode: 'manual',
    aspectratio: { x: 1.4, y: 1, z: 0.34 },
    camera: { eye: { x: 1.55, y: -1.95, z: 0.95 } },
    bgcolor: '#02040a'
  },
  margin: { l: 0, r: 0, t: 0, b: 0 },
  showlegend: false
};

const plotDiv = document.getElementById('plot');
Plotly.newPlot(plotDiv, traces, layout, {
  responsive: true,
  displayModeBar: true,
  modeBarButtonsToRemove: ['toImage', 'sendDataToCloud'],
  displaylogo: false
});

plotDiv.on('plotly_click', function(data) {
  const pt = data.points[0];
  if (pt && pt.customdata) {
    document.getElementById('info-title').innerHTML = pt.customdata.title;
    document.getElementById('info-body').innerHTML = pt.customdata.detail;
    document.getElementById('info-panel').style.display = 'block';
  }
});
</script>
</body>
</html>
